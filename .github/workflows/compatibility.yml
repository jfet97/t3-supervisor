# Published-T3 compatibility (docs/ci.md, "Published-T3 compatibility"): the disposable published-T3 check and the provider-free cohort
# probe against the published T3 builds in the four slots of one frozen target lock (docs/local-stack.md, "Published T3 targets"),
# through the same ./dev commands contributors run. It runs as the daily advisory canary, as a manual reproduction from a new lock or an
# earlier run's frozen lock, and as the version PR's gate, which check.yml calls. The lock job resolves the lock once and every slot runs
# from exactly those bytes; nothing resolves again. Its only credential is the automatic read-only workflow token, which only the resolve
# step hands to ./dev and only the earlier-lock job uses to read another run's artifact.
name: Published T3 compatibility

on:
  # the advisory canary: never part of the check aggregate and never a release gate; GitHub's ordinary notifications are its alert
  schedule:
    - cron: '41 5 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
    inputs:
      slots:
        description: The slots to run, all or a comma-separated list of stable, nightly, nightly-1 and nightly-2
        type: string
        default: all
        required: true
      lock_run:
        description: The ID of an earlier run whose frozen t3-lock artifact the slots run from; empty resolves a new lock
        type: string
        default: ''
        required: false
      architecture:
        description: The native runner architecture of every chosen slot
        type: choice
        options: [x64, arm64]
        default: x64
        required: true
  # the version PR's gate (check.yml): every slot on x64 and the stable and newest nightly slots also on native ARM64, from a new lock
  workflow_call:
    inputs:
      gate:
        description: Run the version PR's gate
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  # a manual reproduction's frozen lock from an earlier run: that run's t3-lock artifact, read with this job's read-only token and handed to
  # the lock job unchanged. It is the only job that reads another run's artifacts, and it runs nothing
  earlier-lock:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.gate && inputs.lock_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Fetch the earlier run's frozen lock
        uses: actions/download-artifact@v4
        with:
          name: t3-lock
          run-id: ${{ inputs.lock_run }}
          github-token: ${{ github.token }}
          path: earlier
      - name: Hand the lock to this run unchanged
        uses: actions/upload-artifact@v4
        with:
          name: t3-earlier-lock
          path: earlier/t3-lock.json
          if-no-files-found: error
          overwrite: true

  # the run's one frozen lock: resolved once here, or taken over unchanged from the earlier-lock job, then recorded with its SHA-256 and
  # kept as the run's t3-lock artifact, from which every slot downloads exactly these bytes. Its outcome is resolved, reused, unavailable,
  # invalid or harness; a lock that is not usable fails every slot with that outcome instead of skipping it
  lock:
    needs: earlier-lock
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      outcome: ${{ steps.record.outputs.outcome }}
      message: ${{ steps.record.outputs.message }}
      sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      # the version PR's gate, the daily canary or a manual reproduction: its slots, each on a native runner of its architecture, and where
      # its lock comes from. A refused input stops the run before anything is resolved or set up
      - name: Select the slots and the lock
        id: plan
        env:
          GATE: ${{ inputs.gate && 'true' || 'false' }}
          EVENT: ${{ github.event_name }}
          SLOTS: ${{ inputs.slots }}
          LOCK_RUN: ${{ inputs.lock_run }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          slots='stable nightly nightly-1 nightly-2'
          refuse() {
            echo "$1" >&2
            printf '### Published T3 compatibility did not start\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 2
          }
          entries=()
          add() {
            local runner
            case $2 in x64) runner=ubuntu-latest ;; arm64) runner=ubuntu-24.04-arm ;; esac
            entries+=("$(jq -cn --arg slot "$1" --arg arch "$2" --arg runner "$runner" '{slot: $slot, arch: $arch, runner: $runner}')")
          }
          source=resolve
          lock_run=
          if [ "$GATE" = true ]; then
            purpose=gate
            for slot in $slots; do add "$slot" x64; done
            add stable arm64
            add nightly arm64
          elif [ "$EVENT" = schedule ]; then
            purpose=canary
            for slot in $slots; do add "$slot" x64; done
          elif [ "$EVENT" = workflow_dispatch ]; then
            purpose=reproduction
            case $ARCHITECTURE in x64|arm64) ;; *) refuse "architecture must be x64 or arm64" ;; esac
            case $LOCK_RUN in
              '') ;;
              *[!0-9]*) refuse "lock_run must be the ID of an earlier run that kept a t3-lock artifact, or empty" ;;
              *) source=earlier; lock_run=$LOCK_RUN ;;
            esac
            requested=${SLOTS//[[:space:]]/}
            [ "$requested" != all ] || requested=${slots// /,}
            IFS=, read -r -a chosen <<< "$requested"
            [ "${#chosen[@]}" -gt 0 ] || refuse "choose all or at least one of stable, nightly, nightly-1 and nightly-2"
            seen=,
            for slot in "${chosen[@]}"; do
              case " $slots " in *" $slot "*) ;; *) refuse "unknown slot '$slot'; choose all or from stable, nightly, nightly-1 and nightly-2" ;; esac
              case $seen in *",$slot,"*) refuse "slot $slot is chosen twice" ;; esac
              seen="$seen$slot,"
              add "$slot" "$ARCHITECTURE"
            done
          else
            refuse "unexpected event $EVENT"
          fi
          {
            echo "purpose=$purpose"
            echo "source=$source"
            echo "lock_run=$lock_run"
            echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '{include: .}')"
          } >> "$GITHUB_OUTPUT"
      - name: Take over the earlier run's lock
        id: earlier
        if: ${{ steps.plan.outputs.source == 'earlier' && needs.earlier-lock.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: t3-earlier-lock
          path: t3-compat/lock
      - uses: actions/checkout@v4
        if: ${{ steps.plan.outputs.source == 'resolve' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare the development environment
        id: prepare
        if: ${{ steps.plan.outputs.source == 'resolve' }}
        timeout-minutes: 20
        run: ./dev setup
      # the automatic read-only workflow token raises GitHub's API rate limit for the release metadata: this step alone hands it to ./dev,
      # which gives it to the toolchain container, and the resolver sends it only with its two metadata requests, for the designated latest
      # release and the release list, never with a download, and never prints or writes it
      - name: Resolve the published T3 targets once
        id: resolve
        if: ${{ steps.plan.outputs.source == 'resolve' }}
        timeout-minutes: 5
        env:
          T3SUP_DEV_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p t3-compat/lock
          ./dev pnpm dev:targets resolve --out t3-compat/lock/t3-lock.json | tee t3-compat/resolve.log
      - name: Record the frozen lock
        id: record
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          SOURCE: ${{ steps.plan.outputs.source }}
          PURPOSE: ${{ steps.plan.outputs.purpose }}
          LOCK_RUN: ${{ steps.plan.outputs.lock_run }}
          FETCHED: ${{ steps.earlier.outcome }}
          PREPARED: ${{ steps.prepare.outcome }}
          RESOLVED: ${{ steps.resolve.outcome }}
        run: |
          set -euo pipefail
          lock=t3-compat/lock/t3-lock.json
          outcome=harness
          message=
          sha256=
          if [ "$SOURCE" = earlier ]; then
            if [ "$FETCHED" = success ] && [ -s "$lock" ]; then outcome=reused
            else outcome=unavailable; message="run $LOCK_RUN has no t3-lock artifact this run could read"; fi
          elif [ "$RESOLVED" = success ] && [ -s "$lock" ]; then outcome=resolved
          elif [ "$PREPARED" != success ]; then message="the checkout or the development environment could not be prepared, so nothing was resolved"
          else
            # the resolver's last JSON line names its outcome: unavailable when GitHub did not answer as needed, invalid when the releases cannot fill the slots
            reported=$(grep '^{' t3-compat/resolve.log 2> /dev/null | tail -n 1 | jq -c 'select(.outcome == "unavailable" or .outcome == "invalid")' 2> /dev/null || true)
            if [ -n "$reported" ]; then
              outcome=$(jq -r '.outcome' <<< "$reported")
              message=$(jq -r '.message | tostring' <<< "$reported")
            else message="the resolver ended without reporting its outcome"; fi
          fi
          if [ "$outcome" = resolved ] || [ "$outcome" = reused ]; then
            if jq -e '(.targets | map(.slot)) == ["stable", "nightly", "nightly-1", "nightly-2"] and all(.targets[]; (.version | type) == "string" and (.version | test("^[0-9A-Za-z.+-]+$")))' "$lock" > /dev/null 2>&1; then
              sha256=$(sha256sum "$lock" | cut -d ' ' -f 1)
            else
              outcome=invalid
              message="the lock does not hold the slots stable, nightly, nightly-1 and nightly-2 in this order with their versions"
            fi
          fi
          message=$(printf '%s' "$message" | tr '\r\n' '  ' | cut -c 1-300)
          {
            echo "outcome=$outcome"
            echo "message=$message"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
          case $PURPOSE in gate) run="the version PR's gate" ;; canary) run="the daily canary" ;; *) run="this manual reproduction" ;; esac
          {
            echo "### Frozen T3 lock: $outcome"
            echo
            case $outcome in
              resolved) echo "Resolved once for $run; every slot runs from this lock, SHA-256 \`$sha256\`." ;;
              reused) echo "Taken over unchanged from run $LOCK_RUN for $run; every slot runs from this lock, SHA-256 \`$sha256\`." ;;
              *) echo "No usable lock for $run, so every slot fails with this outcome: $message" ;;
            esac
            if [ -n "$sha256" ]; then
              echo
              jq -r '"Resolved at \(.resolvedAt) from \(.source).", "", "| Slot | T3 | Published |", "| --- | --- | --- |", (.targets[] | "| \(.slot) | \(.version) | \(.publishedAt) |")' "$lock"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$sha256" ]
      - name: Keep the frozen lock
        if: ${{ !cancelled() && steps.record.outputs.sha256 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: t3-lock
          path: t3-compat/lock/t3-lock.json
          if-no-files-found: error
          overwrite: true

  # the dashboard of the checked commit, which does not depend on the architecture, built once per run for every slot: ui-dist with the
  # commit it was built from and the SHA-256 of each of its files, which each slot verifies against its own checkout instead of building
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build the dashboard of the checked commit
        timeout-minutes: 25
        run: |
          ./dev setup
          ./dev pnpm build
      - name: Record the commit and the files of the build
        id: manifest
        run: |
          set -euo pipefail
          mkdir -p t3-compat/assets
          git rev-parse HEAD > t3-compat/assets/commit
          (cd ui-dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > t3-compat/assets/ui-dist.sha256
          grep -q '  \./index\.html$' t3-compat/assets/ui-dist.sha256
      - name: Keep the dashboard for every slot
        uses: actions/upload-artifact@v4
        with:
          name: t3-compat-assets
          path: |
            ui-dist/
            t3-compat/assets/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  # one slot on a native runner of its architecture: the disposable published-T3 check and the cohort probe from the frozen lock, with the
  # dashboard built once for the run and a verified T3 runtime cache shared within the job, judged against the lock's SHA-256,
  # the slot's T3 version and the checked commit, and summarized. A failing slot never stops another; its reports, logs and lock stay as
  # an artifact also when a run fails or times out
  slot:
    needs: [lock, assets]
    if: ${{ !cancelled() && needs.lock.outputs.matrix != '' }}
    name: ${{ matrix.slot }} on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lock.outputs.matrix) }}
    steps:
      - name: Require a native runner of the slot's architecture
        id: native
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case $ARCH in
            x64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: ${{ needs.lock.outputs.sha256 != '' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # the evidence lies in the checkout the containers see, outside Git status; the runtime stays in the job's Docker cache
      - name: Keep the evidence out of the checkout's status
        id: evidence
        if: ${{ needs.lock.outputs.sha256 != '' }}
        run: |
          mkdir -p .git/info t3-compat/lock
          printf '%s\n' /t3-compat/ >> .git/info/exclude
      - name: Download the frozen lock
        if: ${{ needs.lock.outputs.sha256 != '' }}
        uses: actions/download-artifact@v4
        with:
          name: t3-lock
          path: t3-compat/lock
      # the slot's T3 version and the SHA-256 of its platform's archive, both from the lock this run recorded
      - name: Verify the frozen lock
        id: lock
        if: ${{ needs.lock.outputs.sha256 != '' }}
        env:
          SLOT: ${{ matrix.slot }}
          ARCH: ${{ matrix.arch }}
          LOCK_SHA256: ${{ needs.lock.outputs.sha256 }}
        run: |
          set -euo pipefail
          lock=t3-compat/lock/t3-lock.json
          actual=$(sha256sum "$lock" | cut -d ' ' -f 1)
          if [ "$actual" != "$LOCK_SHA256" ]; then echo "the downloaded lock has SHA-256 $actual, not the frozen $LOCK_SHA256" >&2; exit 1; fi
          case $ARCH in x64) platform=linux-x64 ;; arm64) platform=linux-arm64 ;; *) exit 1 ;; esac
          target=$(jq -ec --arg slot "$SLOT" '[.targets[] | select(.slot == $slot)] | if length == 1 then .[0] else error("the lock has no single target of this slot") end' "$lock")
          version=$(jq -er '.version' <<< "$target")
          archive=$(jq -er --arg platform "$platform" '.archives[$platform]' <<< "$target")
          [[ $version =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "the lock names an unexpected version for $SLOT" >&2; exit 1; }
          [[ $archive =~ ^[0-9a-f]{64}$ ]] || { echo "the lock names no SHA-256 of the $platform archive for $SLOT" >&2; exit 1; }
          {
            echo "version=$version"
            echo "platform=$platform"
            echo "archive=$archive"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Download the dashboard of the checked commit
        if: ${{ steps.lock.outcome == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: t3-compat-assets
          path: .
      # a slot runs only with the dashboard built from its own checked commit, file for file as the assets job recorded it
      - name: Verify the dashboard of the checked commit
        id: assets
        if: ${{ steps.lock.outcome == 'success' }}
        run: |
          set -euo pipefail
          manifest=t3-compat/assets/ui-dist.sha256
          test "$(cat t3-compat/assets/commit)" = "$(git rev-parse HEAD)"
          test "$(cd ui-dist && find . -type f | wc -l)" -eq "$(wc -l < "$manifest")"
          (cd ui-dist && sha256sum --quiet --strict --check "../$manifest")
      - name: Prepare the development environment
        id: prepare
        if: ${{ steps.assets.outcome == 'success' }}
        timeout-minutes: 20
        run: ./dev setup
      # each run keeps its output, exit status and wall time; both commands share /cache/t3-runtime within this job
      - name: Run the published-T3 check
        id: check
        if: ${{ steps.prepare.outcome == 'success' }}
        timeout-minutes: 15
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -uo pipefail
          started=$(date +%s)
          status=0
          ./dev check --t3-lock t3-compat/lock/t3-lock.json --slot "$SLOT" 2> >(tee t3-compat/check.err >&2) | tee t3-compat/check.log || status=$?
          echo "$status $(($(date +%s) - started))" > t3-compat/check.status
      - name: Run the cohort probe
        id: probe
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 10
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          set -uo pipefail
          started=$(date +%s)
          status=0
          ./dev pnpm exec node --import tsx scripts/t3-cohort.ts --probe --cache-dir /cache/t3-runtime --t3-lock t3-compat/lock/t3-lock.json --slot "$SLOT" 2> >(tee t3-compat/probe.err >&2) | tee t3-compat/probe.log || status=$?
          echo "$status $(($(date +%s) - started))" > t3-compat/probe.status
      # a slot passes only when both runs passed and both reports name this slot, its T3 version in the lock, the lock's SHA-256 and the
      # checked commit with a clean tree; a mismatch or a missing report is a harness or provenance failure, never a pass
      - name: Judge and summarize the slot
        id: judge
        if: ${{ always() }}
        env:
          SLOT: ${{ matrix.slot }}
          ARCH: ${{ matrix.arch }}
          NATIVE: ${{ steps.native.outcome }}
          LOCK_OUTCOME: ${{ needs.lock.outputs.outcome }}
          LOCK_MESSAGE: ${{ needs.lock.outputs.message }}
          LOCK_SHA256: ${{ needs.lock.outputs.sha256 }}
          VERIFIED: ${{ steps.lock.outcome }}
          VERSION: ${{ steps.lock.outputs.version }}
          COMMIT: ${{ steps.lock.outputs.commit }}
          ASSETS: ${{ steps.assets.outcome }}
          PREPARED: ${{ steps.prepare.outcome }}
        run: |
          set -uo pipefail
          dir=t3-compat
          mkdir -p "$dir"
          problems=()
          failing=()
          rows=()
          timings=()
          # the last JSON object a run printed: its summary line
          report() { grep '^{' "$dir/$1.log" 2> /dev/null | tail -n 1 | jq -ce 'select(type == "object")' 2> /dev/null; }
          # what a report names instead of this slot's frozen inputs
          mismatch() {
            jq -r --arg slot "$SLOT" --arg version "$VERSION" --arg sha "$LOCK_SHA256" --arg commit "$COMMIT" '[
              if .slot != $slot then "slot \(.slot)" else empty end,
              if .t3 != $version then "T3 \(.t3)" else empty end,
              if (.lock | type) != "object" then "no lock" elif .lock.sha256 != $sha then "a lock with SHA-256 \(.lock.sha256)" else empty end,
              if .supervisor.revision != $commit then "commit \(.supervisor.revision)" else empty end,
              if .supervisor.clean != true then "a tree that was not clean" else empty end
            ] | join(", ")' <<< "$1"
          }
          # one run: its report against the frozen inputs, its own verdict, what did not pass and its timings
          judge() {
            local name=$1 label=$2 failed=$3 spent=$4 timing=$5 json wrong names verdict duration status='' seconds=''
            if [ -f "$dir/$name.status" ]; then read -r status seconds < "$dir/$name.status" || true; fi
            if ! json=$(report "$name"); then
              if [ -n "$status" ]; then problems+=("the $label exited $status without a JSON summary"); else problems+=("the $label did not finish"); fi
              rows+=("| $label | no summary | | | ${seconds:+$seconds s} |")
              return 0
            fi
            printf '%s\n' "$json" > "$dir/$name.json"
            # a report jq cannot read is a mismatch too, never an empty one
            wrong=$(mismatch "$json") || wrong="inputs of an unexpected shape"
            [ -z "$wrong" ] || problems+=("the $label report names $wrong instead of this slot's frozen inputs")
            names=$(jq -r "$failed" <<< "$json") || names="unreadable names"
            duration=$(jq -r "$spent" <<< "$json") || duration="?"
            if [ "$(jq -r '.passed == true' <<< "$json")" = true ]; then
              verdict=passed
              [ "$status" = 0 ] || problems+=("the $label exited ${status:-without a status} despite a passing summary")
            else
              verdict=failed
              failing+=("$label")
              [ "$status" != 0 ] || problems+=("the $label exited 0 despite a failing summary")
            fi
            rows+=("| $label | $verdict | ${names:-none} | $duration s | ${seconds:+$seconds s} |")
            timings+=("$(jq -r "$timing" <<< "$json" || true)")
          }
          if [ "$NATIVE" != success ]; then
            problems+=("this runner is not a native $ARCH runner")
          elif [ -z "$LOCK_SHA256" ]; then
            problems+=("no usable frozen T3 lock (${LOCK_OUTCOME:-missing})${LOCK_MESSAGE:+: $LOCK_MESSAGE}")
          elif [ "$VERIFIED" != success ]; then
            problems+=("the downloaded lock is not the frozen lock this run recorded")
          elif [ "$ASSETS" != success ]; then
            problems+=("the dashboard is missing or not the build of the checked commit")
          elif [ "$PREPARED" != success ]; then
            problems+=("the development environment could not be prepared")
          else
            judge check "12-check run" \
              '[.results[]? | select(.ok != true) | .name + (if .notRun == true then " (not run)" else "" end)] | join(", ")' \
              '(.totalMs // 0) / 100 | round / 10' \
              '"12-check run stages: " + ([.stages[]? | "\(.stage) \((.durationMs // 0) / 100 | round / 10) s" + (if .detail then " (\(.detail))" else "" end)] | join("; "))'
            judge probe "cohort probe" \
              '[.steps[]? | select(.outcome != "accepted") | "\(.name) (\(.outcome))"] | join(", ")' \
              '([.steps[]?.elapsedMs] | add // 0) / 100 | round / 10' \
              '"Cohort probe steps: " + ([.steps[]? | "\(.name) \((.elapsedMs // 0) / 100 | round / 10) s"] | join("; "))'
          fi
          if [ "$NATIVE" = success ] && [ -z "$LOCK_SHA256" ]; then outcome=${LOCK_OUTCOME:-harness}
          elif [ "${#problems[@]}" -gt 0 ]; then outcome=harness
          elif [ "${#failing[@]}" -gt 0 ]; then outcome=failed
          else outcome=passed; fi
          case $outcome in
            passed) meaning="Both runs passed against this T3 build." ;;
            failed) meaning="A check or a probe step did not pass against this T3 build." ;;
            harness) meaning="The harness or the provenance of its evidence failed; this is no verdict on the T3 build." ;;
            *) meaning="No frozen lock was usable, so nothing ran on this slot." ;;
          esac
          {
            echo "### $SLOT on $ARCH: $outcome"
            echo
            echo "$meaning"
            echo
            if [ -n "$VERSION" ]; then printf 'T3 `%s` from the frozen lock `%s` (%s), Supervisor `%s`.\n\n' "$VERSION" "$LOCK_SHA256" "$LOCK_OUTCOME" "$COMMIT"; fi
            if [ "${#rows[@]}" -gt 0 ]; then
              echo "| Run | Result | Not passing | Report time | Step time |"
              echo "| --- | --- | --- | --- | --- |"
              printf '%s\n' "${rows[@]}"
              echo
            fi
            for problem in "${problems[@]}"; do echo "- $problem"; done
            for timing in "${timings[@]}"; do echo; echo "$timing"; done
          } | tee "$dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          [ "$outcome" = passed ]
      - name: Keep the slot's reports, logs and lock
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t3-compat-${{ matrix.slot }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: t3-compat/
          if-no-files-found: ignore
