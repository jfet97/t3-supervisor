name: Check Supervisor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Full validation, or automatic release-metadata proof
        type: choice
        options: [full, auto]
        default: full
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.proof.outputs.mode }}
    steps:
      - name: Select evidence lookup
        id: scope
        uses: actions/github-script@v8
        env:
          VALIDATION: ${{ inputs.validation || 'full' }}
        with:
          script: |
            // ordinary PRs and manual full dispatches need no source lookup before their full checks
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const release = context.eventName === 'pull_request'
              ? pr?.head.ref === 'changeset-release/main' && pr?.head.repo?.full_name === repository && pr?.base.ref === 'main'
              : context.eventName === 'workflow_dispatch' && process.env.VALIDATION === 'auto' && context.ref === 'refs/heads/changeset-release/main';
            core.setOutput('needed', String((context.eventName === 'push' && context.ref === 'refs/heads/main') || release));
      - uses: actions/checkout@v4
        if: ${{ steps.scope.outputs.needed == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: ./.github/actions/setup-dependencies
        if: ${{ steps.scope.outputs.needed == 'true' }}
      - name: Prove the validation plan
        id: proof
        uses: actions/github-script@v8
        env:
          VALIDATION: ${{ inputs.validation || 'full' }}
          EVIDENCE_NEEDED: ${{ steps.scope.outputs.needed }}
        with:
          script: |
            core.setOutput('mode', 'full');
            if (process.env.EVIDENCE_NEEDED !== 'true') return;
            try {
              const { pathToFileURL } = require('node:url');
              const root = pathToFileURL(`${process.cwd()}/package.json`).href;
              const localRequire = require('node:module').createRequire(root);
              const { tsImport } = localRequire('tsx/esm/api');
              const { runCiPlan } = await tsImport('./scripts/ci-evidence.ts', root);
              const plan = await runCiPlan({ github, context, validation: process.env.VALIDATION });
              core.setOutput('mode', plan.mode);
              if (plan.mode === 'full') {
                core.notice('Complete validation selected: release-only equivalence and full source evidence were not both proven.');
                return;
              }
              const link = id => `[run ${id}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${id})`;
              const detail = plan.mode === 'release'
                ? `Release ${plan.from} → ${plan.to}: full baseline ${link(plan.baselineRunId)}; static, package and container checks still run on this version.`
                : `Exact merged tree reuses ${link(plan.runId)}.${plan.baselineRunId ? ` Full release baseline: ${link(plan.baselineRunId)}.` : ''}`;
              await core.summary.addHeading(plan.mode === 'release' ? 'Release metadata fast track' : 'Exact validation reused').addRaw(detail).write();
            } catch {
              core.setOutput('mode', 'full');
              core.notice('Validation evidence unavailable; running complete checks.');
            }

  static:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Prepare the installable artifact
        id: package
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.gitHead=process.env.REVISION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+p.version+"\n")'
          mkdir -p "$RUNNER_TEMP/release-package" "$RUNNER_TEMP/release-install"
          pnpm pack --ignore-scripts --out "$RUNNER_TEMP/release-package/t3-supervisor-$(node -p 'require("./package.json").version').tgz"
          pnpm --dir "$RUNNER_TEMP/release-install" add --prod --offline --ignore-scripts "$RUNNER_TEMP/release-package/t3-supervisor-$(node -p 'require("./package.json").version').tgz"
          node --import tsx scripts/smoke-release.ts package "$RUNNER_TEMP/release-install/node_modules/.bin/t3-supervisor"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: t3-supervisor:ci-check
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=ci-image
          # a failed cache write stays in the log and never fails the build
          cache-to: type=gha,mode=max,scope=ci-image,ignore-error=true
      - name: Verify the container artifact
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' t3-supervisor:ci-check)" = linux/amd64
          node --import tsx scripts/smoke-release.ts image t3-supervisor:ci-check

  # the ARM64 container artifact is built and run on a native ARM64 runner; nothing is emulated
  arm64:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require a native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - name: Read the package version
        id: package
        run: node -e 'process.stdout.write("version="+require("./package.json").version+"\n")' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the ARM64 container artifact without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: t3-supervisor:ci-check-arm64
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=ci-image-arm64
          # a failed cache write stays in the log and never fails the build
          cache-to: type=gha,mode=max,scope=ci-image-arm64,ignore-error=true
      - name: Verify the ARM64 container artifact
        env:
          SMOKE_PLATFORM: linux/arm64
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' t3-supervisor:ci-check-arm64)" = linux/arm64
          node --import tsx scripts/smoke-release.ts image t3-supervisor:ci-check-arm64

  main:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.plan.outputs.mode != 'release' }}
    name: main (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test --shard=${{ matrix.shard }}/4 --maxWorkers=1

  harness:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.plan.outputs.mode != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test:harness

  startup:
    needs: plan
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test test/startup-integration.test.ts

  check:
    if: ${{ always() }}
    needs: [plan, static, arm64, main, harness, startup]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
          MAIN_RESULT: ${{ needs.main.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$STARTUP_RESULT" = success
          case "$MODE" in
            reuse)
              test "$STATIC_RESULT" = skipped
              test "$ARM64_RESULT" = skipped
              test "$MAIN_RESULT" = skipped
              test "$HARNESS_RESULT" = skipped
              ;;
            release)
              test "$STATIC_RESULT" = success
              test "$ARM64_RESULT" = success
              test "$MAIN_RESULT" = skipped
              test "$HARNESS_RESULT" = skipped
              ;;
            full)
              test "$STATIC_RESULT" = success
              test "$ARM64_RESULT" = success
              test "$MAIN_RESULT" = success
              test "$HARNESS_RESULT" = success
              ;;
            *) exit 1 ;;
          esac
