name: Check Supervisor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Full validation, or automatic release-metadata proof
        type: choice
        options: [full, auto]
        default: full
        required: true
      browser_repetitions:
        description: Consecutive runs of the browser journeys in the browser job, 1 to 20; more than 1 calibrates their flakiness
        type: number
        default: 1
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.proof.outputs.mode }}
      compatibility: ${{ steps.proof.outputs.compatibility }}
    steps:
      - name: Select evidence lookup
        id: scope
        uses: actions/github-script@v8
        env:
          VALIDATION: ${{ inputs.validation || 'full' }}
        with:
          script: |
            /* Ordinary PRs and manual full dispatches need no source lookup before their full checks. Only a run of the version branch,
             * its PR or a dispatch on it, calls the published-T3 compatibility gate; no other run resolves T3 targets. */
            const pr = context.payload.pull_request;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const versionBranch = context.eventName === 'pull_request'
              ? pr?.head.ref === 'changeset-release/main' && pr?.head.repo?.full_name === repository && pr?.base.ref === 'main'
              : context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/changeset-release/main';
            const release = versionBranch && (context.eventName === 'pull_request' || process.env.VALIDATION === 'auto');
            core.setOutput('needed', String((context.eventName === 'push' && context.ref === 'refs/heads/main') || release));
            core.setOutput('compatibility', versionBranch ? 'gate' : 'none');
      - uses: actions/checkout@v4
        if: ${{ steps.scope.outputs.needed == 'true' }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: ./.github/actions/setup-dependencies
        if: ${{ steps.scope.outputs.needed == 'true' }}
      - name: Prove the validation plan
        id: proof
        uses: actions/github-script@v8
        env:
          VALIDATION: ${{ inputs.validation || 'full' }}
          EVIDENCE_NEEDED: ${{ steps.scope.outputs.needed }}
          COMPATIBILITY: ${{ steps.scope.outputs.compatibility }}
        with:
          script: |
            core.setOutput('mode', 'full');
            core.setOutput('compatibility', process.env.COMPATIBILITY);
            if (process.env.EVIDENCE_NEEDED !== 'true') return;
            try {
              const { pathToFileURL } = require('node:url');
              const root = pathToFileURL(`${process.cwd()}/package.json`).href;
              const localRequire = require('node:module').createRequire(root);
              const { tsImport } = localRequire('tsx/esm/api');
              const { runCiPlan } = await tsImport('./scripts/ci-evidence.ts', root);
              const plan = await runCiPlan({ github, context, validation: process.env.VALIDATION });
              core.setOutput('mode', plan.mode);
              // main reuses a version branch run only with that run's published-T3 compatibility gate and frozen T3 lock
              if (plan.compatibility) core.setOutput('compatibility', 'reused');
              if (plan.mode === 'full') {
                core.notice('Complete validation selected: release-only equivalence and full source evidence were not both proven.');
                return;
              }
              const link = id => `[run ${id}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${id})`;
              const gate = plan.compatibility ? ', including its published-T3 compatibility gate and the frozen T3 lock it keeps as its t3-lock artifact' : '';
              const detail = plan.mode === 'release'
                ? `Release ${plan.from} → ${plan.to}: full baseline ${link(plan.baselineRunId)}; static, package and container checks still run on this version.`
                : `Exact merged tree reuses ${link(plan.runId)}${gate}.${plan.baselineRunId ? ` Full release baseline: ${link(plan.baselineRunId)}.` : ''}`;
              await core.summary.addHeading(plan.mode === 'release' ? 'Release metadata fast track' : 'Exact validation reused').addRaw(detail).write();
            } catch {
              core.setOutput('mode', 'full');
              core.setOutput('compatibility', process.env.COMPATIBILITY);
              core.notice('Validation evidence unavailable; running complete checks.');
            }
      # publication reads this step: a merged version PR publishes stable automatically only after main reused that PR's checked run, whose
      # published-T3 compatibility gate passed from its frozen lock; main never resolves T3 targets itself
      - name: Reuse the version PR compatibility evidence
        if: ${{ steps.proof.outputs.compatibility == 'reused' }}
        run: echo "main reuses the version PR run with its published-T3 compatibility gate and frozen T3 lock"

  static:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Prepare the installable artifact
        id: package
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.gitHead=process.env.REVISION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+p.version+"\n")'
          mkdir -p "$RUNNER_TEMP/release-package" "$RUNNER_TEMP/release-install"
          pnpm pack --ignore-scripts --out "$RUNNER_TEMP/release-package/t3-supervisor-$(node -p 'require("./package.json").version').tgz"
          # a user's install: plain npm into an empty prefix, resolving every dependency afresh from the registry, without this checkout's lock
          npm install --prefix "$RUNNER_TEMP/release-install" --no-save --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/release-package/t3-supervisor-$(node -p 'require("./package.json").version').tgz"
          node --import tsx scripts/smoke-release.ts package "$RUNNER_TEMP/release-install/node_modules/.bin/t3-supervisor"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: t3-supervisor:ci-check
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=ci-image
          # a failed cache write stays in the log and never fails the build
          cache-to: type=gha,mode=max,scope=ci-image,ignore-error=true
      - name: Verify the container artifact
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' t3-supervisor:ci-check)" = linux/amd64
          node --import tsx scripts/smoke-release.ts image t3-supervisor:ci-check

  # the ARM64 container artifact is built and run on a native ARM64 runner; nothing is emulated
  arm64:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Require a native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - name: Read the package version
        id: package
        run: node -e 'process.stdout.write("version="+require("./package.json").version+"\n")' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the ARM64 container artifact without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: t3-supervisor:ci-check-arm64
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=ci-image-arm64
          # a failed cache write stays in the log and never fails the build
          cache-to: type=gha,mode=max,scope=ci-image-arm64,ignore-error=true
      - name: Verify the ARM64 container artifact
        env:
          SMOKE_PLATFORM: linux/arm64
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' t3-supervisor:ci-check-arm64)" = linux/arm64
          node --import tsx scripts/smoke-release.ts image t3-supervisor:ci-check-arm64

  main:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.plan.outputs.mode != 'release' }}
    name: main (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test --shard=${{ matrix.shard }}/4 --maxWorkers=1

  harness:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.plan.outputs.mode != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test:harness

  startup:
    needs: plan
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm test test/startup-integration.test.ts

  # the browser journeys (docs/testing.md): the production Supervisor over the scripted T3 peer and this checkout's dashboard in
  # the pinned e2e image's headless Chromium, through the same ./dev entry contributors use. It needs no credentials; a failed
  # journey's trace, screenshot and page errors hold only its own destroyed test sessions
  browser:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.plan.outputs.mode != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # ordinary validation runs the journeys once; a manual calibration repeats them without retries and stops at the first failure.
      # A dispatched number is formatted before the fallback because a number 0 is falsy and would otherwise become 1 unseen.
      - name: Run the browser journeys
        env:
          REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.browser_repetitions) || 1 }}
        run: |
          set -eu
          case "$REPETITIONS" in ''|*[!0-9]*) echo "browser_repetitions must be a whole number" >&2; exit 2 ;; esac
          if [ "$REPETITIONS" -lt 1 ] || [ "$REPETITIONS" -gt 20 ]; then echo "browser_repetitions must be between 1 and 20" >&2; exit 2; fi
          for run in $(seq 1 "$REPETITIONS"); do
            started=$(date +%s)
            ./dev e2e
            echo "browser journeys run $run of $REPETITIONS passed in $(($(date +%s) - started)) s on $(uname -m)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep the failed journeys' browser evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-journeys-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # the published-T3 compatibility gate (docs/ci.md): only a version branch run calls compatibility.yml, which resolves one frozen T3 lock and
  # runs every slot on x64 and the stable and newest nightly slots also on native ARM64. Ordinary PRs never call it, and main only reuses
  # the version PR run's verdict; actions: read is the ceiling for the reproduction job of that workflow, which never runs here
  t3-compatibility:
    needs: plan
    if: ${{ always() && !cancelled() && needs.plan.outputs.compatibility == 'gate' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/compatibility.yml
    with:
      gate: true

  check:
    if: ${{ always() }}
    needs: [plan, static, arm64, main, harness, startup, browser, t3-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          COMPATIBILITY: ${{ needs.plan.outputs.compatibility }}
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
          MAIN_RESULT: ${{ needs.main.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          STARTUP_RESULT: ${{ needs.startup.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPATIBILITY_RESULT: ${{ needs.t3-compatibility.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$STARTUP_RESULT" = success
          # a version branch run requires its compatibility gate; every other run never calls it, and only main's reuse inherits it
          case "$COMPATIBILITY" in
            gate)
              test "$MODE" != reuse
              test "$COMPATIBILITY_RESULT" = success
              ;;
            reused)
              test "$MODE" = reuse
              test "$COMPATIBILITY_RESULT" = skipped
              ;;
            none) test "$COMPATIBILITY_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          case "$MODE" in
            reuse)
              test "$STATIC_RESULT" = skipped
              test "$ARM64_RESULT" = skipped
              test "$MAIN_RESULT" = skipped
              test "$HARNESS_RESULT" = skipped
              test "$BROWSER_RESULT" = skipped
              ;;
            release)
              test "$COMPATIBILITY" = gate
              test "$STATIC_RESULT" = success
              test "$ARM64_RESULT" = success
              test "$MAIN_RESULT" = skipped
              test "$HARNESS_RESULT" = skipped
              test "$BROWSER_RESULT" = skipped
              ;;
            full)
              test "$STATIC_RESULT" = success
              test "$ARM64_RESULT" = success
              test "$MAIN_RESULT" = success
              test "$HARNESS_RESULT" = success
              test "$BROWSER_RESULT" = success
              ;;
            *) exit 1 ;;
          esac
